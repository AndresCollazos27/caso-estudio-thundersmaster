# Contenido del caso Tomatera. Sale de los diseños aprobados:
#   ../2026-11-02-caso-tomatera-diseno.md y ../2026-11-02-tomatera-software-diseno.md
# Se puede corregir sin tocar el código. Cada sesión guarda una copia al crearse,
# así que los cambios solo valen para las sesiones nuevas.

caso:
  nombre: Tomatera
  empresa: Terraza Viva, S. L.
  equipo: Nodo Sur

fichaTecnica:
  titulo: "Ficha técnica: «Cultivar tomates en maceta» (Verde es Vida)"
  url: https://www.verdeesvida.es/huerto_3/cultivar_tomates_en_maceta_34

consentimiento: >-
  Esta actividad es parte del estudio de caso de un trabajo de grado de Ingeniería de Sistemas
  de la Universidad del Cauca (Colombia) sobre THUNDERS Master, un proceso para construir
  entendimiento compartido en los requisitos. Participar es voluntario y no afecta tu nota.
  La app registra lo que escribes y marcas durante la sesión con un identificador anónimo;
  no se graba audio ni video, y tu apodo no se incluye en los datos que se analizan.
  Puedes dejar de participar cuando quieras. Al aceptar, autorizas el uso anónimo de tus
  respuestas con fines académicos.

roles:
  PO: { nombre: Lucía Ferrer, etiqueta: PO · Lucía, color: "#B3261E" }
  SD: { nombre: Paco Ruiz, etiqueta: SD · Paco, color: "#C2570C" }
  SD2: { nombre: Carmen Ortega, etiqueta: SD · Carmen, color: "#9A4A17" }
  FR: { nombre: Facilitador, etiqueta: FR, color: "#1E2761" }
  AN: { nombre: Analista, etiqueta: AN, color: "#1E7A3C" }
  QA: { nombre: Calidad, etiqueta: QA, color: "#0F766E" }
  RT: { nombre: Relator, etiqueta: RT, color: "#5C6672" }

cartas:
  PO:
    quienEres: >-
      Eres Lucía Ferrer, dueña de Terraza Viva, una pyme de Madrid que vende kits para cultivar
      tomates en terrazas y balcones. Decides qué entra en Tomatera y qué no, y aceptas los requisitos.
    vienesAPedir:
      - Un kit que cuide los tomates solo, para que el cliente no tenga que estar pendiente.
      - >-
        Que la app avise cuando una planta tenga más de dos guías, porque hay que dejar una o dos.
        Las guías son los tallos principales.
      - Que avise antes de que la noche baje de 10 °C, porque por debajo de 10 °C la planta no crece.
      - Que el kit produzca mucho, porque lo que vende es la cosecha.
    dasPorHecho:
      - >-
        Tomatera riega sola: el kit trae una bomba pequeña y un depósito de agua. Para ti,
        «que cuide los tomates solo» quiere decir eso.
      - >-
        El año que viene quieres vender Tomatera también en Argentina. Solo lo cuentas si te
        preguntan por el mercado o por dónde se va a usar la app.
      - Si para que produzca mucho hay que recomendar híbridos, se recomiendan.
    comoHablas: Hablas como española. Puedes decir «vale», «el móvil», «el ordenador» o «el piso».
  SD:
    quienEres: >-
      Eres Paco Ruiz, asesor de huerto de Terraza Viva. Conoces las reglas del cultivo por la ficha
      técnica de la empresa y quieres que Tomatera las respete.
    vienesAPedir:
      - Que Tomatera avise cuándo poner el tutor, que es una caña o un palo, y atar los tallos.
      - >-
        Que siga el calendario de la ficha: el semillero, protegido, se empieza a finales de enero;
        los planteles van a la maceta desde marzo si el clima es suave, y desde abril si es frío y
        van sin protección.
      - >-
        Que avise si la temperatura sale de lo óptimo: de 20 a 30 °C de día y de 1 a 17 °C de noche.
      - >-
        Que recomiende variedades tradicionales, mejor si son de la zona, porque en casa hay que
        darle prioridad al sabor.
    dasPorHecho:
      - Tomatera se vende con planteles, que son plantas jóvenes de 4 o 5 hojas listas para trasplantar.
      - >-
        Con la planta ya establecida hay que dejar secar el sustrato entre riegos. Para ti, seco es
        cuando la tierra está seca al tacto en la superficie. Recién trasplantada, el riego es clave.
      - No tiene sentido recomendar híbridos.
    comoHablas: Hablas como español. Puedes decir «vale», «tío» o «el móvil», y «recolectar» para la cosecha.
  SD2:
    quienEres: >-
      Eres Carmen Ortega, clienta jubilada de Terraza Viva. Cultivas tomates en la terraza de tu piso
      en Valencia: eres quien hace la tarea todos los días.
    vienesAPedir:
      - Saber si tus tomates tienen luz suficiente, porque tu terraza da al norte y le entra poco sol.
      - Que la app te hable claro, sin palabras técnicas.
    dasPorHecho:
      - Para ti la tierra es la tierra y las ramas son ramas; no usas palabras como sustrato, guía o tutor.
      - Riegas cuando ves las hojas caídas. Es tu costumbre.
    comoHablas: Hablas como española, despacio y con ejemplos de tu terraza.
  AN:
    quienEres: >-
      Eres analista en Nodo Sur, la empresa de software de La Plata que desarrolla Tomatera.
      Haces las preguntas y escribes las necesidades y los requisitos.
    vienesAPedir:
      - Entender qué tiene que hacer Tomatera en este primer ciclo.
      - Que cada necesidad quede con su fuente, sus supuestos y su prioridad.
    dasPorHecho:
      - El presupuesto que aprobó Nodo Sur cubre el sensor y la app. Tomatera mide y avisa, y la persona riega.
      - En un sensor de humedad, «seco» es por debajo de 30 %.
      - En el último proyecto de Nodo Sur, las «guías» eran los tutoriales paso a paso de la app.
      - Un plantel es un grupo de personas, como el plantel docente o el de un club.
  QA:
    quienEres: >-
      Eres quien construirá y probará Tomatera en Nodo Sur. Necesitas que cada requisito crítico
      tenga un criterio que se pueda probar.
    vienesAPedir:
      - Un solo umbral para probar la alerta de frío, y saber qué pasa justo en el límite.
      - Ejemplos concretos para cada requisito crítico, del tipo «¿qué pasa si…?».
    dasPorHecho:
      - Vas a probar el calendario de avisos y programas los meses tal como los diga el cliente.
      - Para ti, «seco» es cuando el sensor marca 0 %.
      - En la app anterior de Nodo Sur, el «tutor» era la persona que acompaña al usuario por chat.
      - A las plantas jóvenes les dices «plantines».

hojas:
  FR:
    texto: >-
      Conduces el ciclo de tu mesa. En la apertura lees la declaración y marcas si las tres versiones
      dicen lo mismo. En el encuentro 1 das la palabra por turnos y marcas el resultado de cada ronda.
      En el encuentro 2 marcas si Paco y el QA entienden igual cada criterio; si hay un conflicto con
      Lucía, medias tú. Al cierre marcas las evidencias E1 a E5.
  RT:
    texto: >-
      Registras lo que se acuerda. Completas en el registro 06 cada divergencia: quién entiende qué,
      la resolución, el estado y el responsable. Agregas al glosario los términos nuevos. Al cierre
      congelas la línea base y anotas las acciones pendientes.

agenda:
  - id: explicacion
    nombre: Explicación
    minutos: 6
    paraTodos: Mira la pantalla. Leandro cuenta la historia y cómo será la hora.
    porRol:
      PO: Escucha a Leandro. Vas a ser Lucía, la dueña de Terraza Viva; en un momento lees tu carta.
      SD: Escucha a Leandro. Vas a ser Paco, el asesor de huerto de Terraza Viva; en un momento lees tu carta.
      SD2: Escucha a Leandro. Vas a ser Carmen, la clienta de Terraza Viva que cuida sus tomates todos los días; en un momento lees tu carta.
      FR: Escucha a Leandro. Vas a conducir la conversación de tu mesa; en un momento lees tu hoja.
      AN: Escucha a Leandro. Vas a preguntar y escribir los requisitos; en un momento lees tu carta.
      QA: Escucha a Leandro. Vas a ser quien construirá y probará Tomatera; en un momento lees tu carta.
      RT: Escucha a Leandro. Vas a registrar lo que se acuerda; en un momento lees tu hoja.
  - id: lectura
    nombre: Lectura
    minutos: 3
    paraTodos: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
    porRol:
      PO: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
      SD: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
      SD2: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
      FR: Lee tu hoja. Conduces el ciclo, das la palabra y marcas el resultado de las rondas.
      AN: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
      QA: Lee tu carta en silencio. No la muestres; lo que sabes se cuenta hablando.
      RT: Lee tu hoja. Registras las divergencias y cierras la línea base.
  - id: medicion_previa
    nombre: Medición previa
    minutos: 2
    paraTodos: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
    porRol:
      PO: Responde sola las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      SD: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      SD2: Responde sola las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      FR: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      AN: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      QA: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
      RT: Responde solo las cuatro preguntas. Nadie verá tus respuestas hasta el final.
  - id: a4
    nombre: Encuentro 1 · A4
    minutos: 4
    paraTodos: Encuentro 1. Cada mesa revisa el problema antes de empezar.
    porRol:
      PO: Escribe con tus palabras qué problema resuelve Tomatera, qué entra y qué resultado esperas. El FR leerá tu versión en voz alta.
      SD: Escribe con tus palabras qué problema resuelve Tomatera, qué entra y qué resultado esperas. El FR leerá tu versión en voz alta.
      SD2: Escucha las versiones de Lucía, Paco y el AN. Tú no escribes una; si algo no se parece a lo que pasa en tu terraza, díselo al FR.
      FR: Lee en voz alta la declaración del problema. Cuando lleguen las versiones de Lucía, Paco y el AN, léelas y marca si dicen lo mismo.
      AN: Escribe con tus palabras qué problema resuelve Tomatera, qué entra y qué resultado esperas. El FR leerá tu versión en voz alta.
      QA: Escucha las tres versiones y anota las palabras que te suenen ambiguas; te servirán para los ejemplos.
      RT: Si el FR marca que una versión no dice lo mismo, completa esa divergencia en el registro 06.
  - id: a51
    nombre: Encuentro 1 · A5.1
    minutos: 13
    paraTodos: Encuentro 1. El AN entrevista al cliente. En los minutos 18 y 23 hay rondas de sondeo.
    porRol:
      PO: Cuenta lo que vienes a pedir, que está en tu carta, y responde lo que te pregunten.
      SD: Cuenta lo que vienes a pedir con las reglas de tu ficha técnica, y responde lo que te pregunten.
      SD2: Cuenta lo que vienes a pedir, que está en tu carta, con ejemplos de tu terraza, y responde lo que te pregunten.
      FR: Da la palabra por turnos y cuida que todos hablen. Cuando llegue una ronda, marca el resultado. En el minuto 27, haz los chequeos de cierre.
      AN: Pregúntales a Lucía y a Paco qué necesitan y qué dan por hecho. Registra cada necesidad con su fuente, sus supuestos y su prioridad.
      QA: Pregunta «¿cómo sabríamos que esto se cumple?» y anota en el glosario los términos que aparezcan.
      RT: Agrega al glosario los términos nuevos y completa en 06 las divergencias que aparezcan.
  - id: a52
    nombre: Sin el cliente · A5.2
    minutos: 7
    paraTodos: Sin el cliente. Lucía y Paco vuelven a Madrid y el equipo escribe los requisitos.
    porRol:
      PO: Vuelves a Madrid, así que apártate de la mesa. Para cada necesidad de prioridad alta, escribe qué resultado esperas, con tus palabras.
      SD: Vuelves a Madrid, así que apártate de la mesa. Para cada necesidad de prioridad alta, escribe qué resultado esperas, con tus palabras.
      SD2: Vuelves a Valencia, así que apártate de la mesa. Para cada necesidad de prioridad alta, escribe qué resultado esperas, con tus palabras.
      FR: Ayuda a elegir qué requisitos son críticos y revisa que cada tarjeta tenga criterio y ejemplo.
      AN: Escribe dos o tres tarjetas críticas, cada una con su necesidad de origen y su criterio.
      QA: Escribe el ejemplo de cada tarjeta crítica con un caso límite («¿qué pasa si…?») y revisa la parte A de I2.
      RT: Pasa a 06 las divergencias que siguen pendientes, con responsable.
  - id: a53
    nombre: Encuentro 2 · A5.3
    minutos: 10
    paraTodos: Encuentro 2. El cliente vuelve y se valida cada requisito crítico con su ejemplo.
    porRol:
      PO: Escucha el ejemplo de cada tarjeta crítica y responde si expresa tu necesidad y si el ejemplo te convence.
      SD: Responde las mismas dos preguntas y, cuando el FR te lo pida, explica el criterio con tus palabras.
      SD2: Escucha el ejemplo de cada tarjeta crítica y responde si expresa tu necesidad y si el ejemplo te convence.
      FR: Pide a Paco y al QA que expliquen el criterio y marca si lo entienden igual. Si hay divergencia, guía la resolución; si Lucía es parte, medias tú.
      AN: Revisa con el QA que no haya requisitos duplicados ni contradicciones (parte B de I2).
      QA: Lee en voz alta el ejemplo de cada tarjeta crítica y, cuando el FR te lo pida, explica el criterio con tus palabras.
      RT: Registra en 06 cada resolución y la conformidad del cliente.
  - id: a6
    nombre: Cierre · A6
    minutos: 6
    paraTodos: Cierre. Se congela la línea base y otra mesa comprueba si se entiende.
    porRol:
      PO: Espera la reconstrucción del QA de otra mesa y confirma si entendió tus requisitos críticos.
      SD: Mira la línea base de tu mesa; es lo que queda acordado.
      SD2: Mira la línea base de tu mesa; es lo que queda acordado.
      FR: Marca las evidencias E1 a E5 viendo las lecturas automáticas.
      AN: Mira la línea base de tu mesa; es lo que queda acordado.
      QA: Lee la línea base de la mesa siguiente y escribe qué entendiste de sus dos primeros requisitos críticos.
      RT: Congela la línea base de tu mesa. Después, revisa que las acciones pendientes tengan responsable.
  - id: medicion_posterior
    nombre: Medición posterior
    minutos: 2
    paraTodos: Responde solo las mismas cuatro preguntas del principio.
    porRol:
      PO: Responde sola las mismas cuatro preguntas del principio.
      SD: Responde solo las mismas cuatro preguntas del principio.
      SD2: Responde sola las mismas cuatro preguntas del principio.
      FR: Responde solo las mismas cuatro preguntas del principio.
      AN: Responde solo las mismas cuatro preguntas del principio.
      QA: Responde solo las mismas cuatro preguntas del principio.
      RT: Responde solo las mismas cuatro preguntas del principio.
  - id: destape
    nombre: Destape y debate
    minutos: 7
    paraTodos: Destape. Leandro muestra las ocho divergencias sembradas. ¿Cuáles encontró tu mesa?
    porRol:
      PO: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.
      SD: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.
      SD2: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.
      FR: Marca cuáles de las ocho divergencias registró tu mesa.
      AN: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.
      QA: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.
      RT: Mira la lista y comenta con tu mesa cuáles encontraron y cómo.

hitos:
  - { id: ronda1, tramo: a51, minuto: 3 }
  - { id: ronda2, tramo: a51, minuto: 8 }
