avance:
  automatico: true
  graciaSegundos: 60

plantillas:
  canvas:
    proyecto: Tomatera, ciclo 1
    objetivo: Tarjetas validadas de los requisitos críticos del primer ciclo de Tomatera, aprobadas por Lucía
    alcance: >-
      Entra el sensor en la maceta y los avisos en la app. Quedan fuera las plagas, las enfermedades
      y la tienda en línea. Contexto de uso: terrazas y balcones, con la app en el móvil del cliente.
    restricciones: "Los textos de la app van en el español de España. No negociable; dueña: Lucía."
    agenda: >-
      Encuentro 1: apertura (4 min) y un bloque de elicitación por entrevista grupal (13 min).
      Encuentro 2: validación (10 min) y cierre (6 min).
    formato: Historia de usuario con criterio y ejemplo
    insumos: Ficha técnica del asesor, disponible si alguien la pide
    participacion: Plenaria por turnos. El encuentro 1 cierra cuando cada necesidad crítica tiene fuente.
    riesgos: "La clienta que hace la tarea no está en todas las mesas. Mediador: el FR."
    fechaE1: El mismo día de la sesión
    fechaE2: El mismo día de la sesión, con 0 días entre encuentros
    implicito: Bajo
    malentendido: Caro
    extensiones: "Equipo distribuido: una paráfrasis por región en la apertura"
  mapa:
    - actor: Lucía Ferrer, dueña
      rol: PO
      aporta: Objetivo del negocio y prioridades
      haceLaTarea: Los clientes riegan y cuidan las plantas
      decide: "Sí: alcance y prioridades"
      disponibilidad: Los dos encuentros
    - actor: Paco Ruiz, asesor de huerto
      rol: SD
      aporta: Reglas de cultivo
      haceLaTarea: ""
      decide: "No"
      disponibilidad: Los dos encuentros
    - actor: Carmen Ortega, clienta
      rol: SD
      aporta: Cómo se cuida la planta en la práctica
      haceLaTarea: Ella misma
      decide: "No"
      disponibilidad: Solo en las mesas de siete
    - actor: Ficha técnica del asesor
      rol: Fuente no humana
      aporta: Las reglas del artículo
      haceLaTarea: ""
      decide: ""
      disponibilidad: A pedido
    - actor: FR de Nodo Sur
      rol: FR
      aporta: Conduce el ciclo
      haceLaTarea: ""
      decide: "No"
      disponibilidad: Los dos encuentros
    - actor: AN de Nodo Sur
      rol: AN
      aporta: Elicita y especifica
      haceLaTarea: ""
      decide: "No"
      disponibilidad: Los dos encuentros
    - actor: QA de Nodo Sur
      rol: QA
      aporta: Construirá y probará
      haceLaTarea: ""
      decide: "No"
      disponibilidad: Los dos encuentros
    - actor: RT de Nodo Sur
      rol: RT
      aporta: Registra y cierra
      haceLaTarea: ""
      decide: "No"
      disponibilidad: Los dos encuentros
  chequeoSuficiencia:
    respuesta: "No"
    detalle: Falta la clienta que hace la tarea en las mesas de seis; queda como acción para el cierre.
  declaracion:
    enunciado: >-
      Quien cultiva tomates en macetas en su terraza no sabe cuándo regar, cuándo entutorar ni cuándo
      trasplantar, y pierde plantas o cosecha poco.
    afectados: Los clientes de Terraza Viva y la propia pyme, que recibe quejas y devoluciones.
    contraste: Paco la reformuló antes del ciclo y su versión es equivalente.
  glosario:
    - { termino: Guía, definicion: "Lo que hay que dejar en cada planta: una o dos", critico: Sí, estado: Tentativo }
    - { termino: Plantel, definicion: Lo que trae el kit para empezar, critico: Sí, estado: Tentativo }
    - { termino: Tutor, definicion: El apoyo de la planta, critico: "No", estado: Tentativo }
    - { termino: Sustrato seco, definicion: Cuando toca regar, critico: Sí, estado: Tentativo }
    - { termino: Temperatura óptima, definicion: La que la planta necesita para crecer bien, critico: Sí, estado: Tentativo }

rondas:
  - numero: 1
    items:
      - { id: guia, termino: Guía, tecnica: Paráfrasis cruzada, pregunta: Explica con tus palabras qué es una guía en Tomatera. }
      - { id: sustrato, termino: Sustrato seco, tecnica: Sondeo de ambigüedad, pregunta: ¿Con qué humedad avisa Tomatera que hay que regar? Escribe un número o una señal. }
  - numero: 2
    items:
      - { id: temperatura, termino: Temperatura óptima, tecnica: Sondeo de ambigüedad, pregunta: ¿A partir de qué temperatura nocturna avisa Tomatera? Escribe un número. }
      - { id: plantel, termino: Plantel, tecnica: Paráfrasis cruzada, pregunta: Explica con tus palabras qué es un plantel. }

medicion:
  - { id: m1, pregunta: "En Tomatera, ¿qué es una guía?", tipo: texto }
  - { id: m2, pregunta: "¿A partir de qué temperatura nocturna avisa Tomatera? Escribe un número.", tipo: numero }
  - { id: m3, pregunta: "Cuando la tierra está seca, ¿qué hace Tomatera?", tipo: texto }
  - { id: m4, pregunta: "¿En qué mes avisa Tomatera que hay que trasplantar?", tipo: texto }

cuestionario:
  afirmaciones:
    - El proceso me ayudó a notar que no entendíamos lo mismo
    - Los pasos que seguimos fueron claros
    - Aplicarlo exigió un esfuerzo mental alto
    - Sentí presión por el tiempo
    - Usaría este proceso en un proyecto real
  # NASA-TLX sin ponderar (López Núñez, Rubio y Luceño, 2010, EduPsykhé 9(2)), de 0 a 100 de 5 en 5.
  # Nombres y preguntas adaptados de la versión española de Díaz Ramiro, Rubio, Martín y Luceño
  # (2010, Revista de Psicología del Trabajo y de las Organizaciones 26(3), doi:10.5093/tr2010v26n3a3).
  tlx:
    - { id: mental, nombre: Demanda mental, descripcion: "¿Cuánta actividad mental y perceptiva te exigió la sesión, como pensar, decidir, calcular, recordar o buscar?", bajo: Muy baja, alto: Muy alta }
    - { id: fisica, nombre: Demanda física, descripcion: "¿Cuánta actividad física te exigió la sesión, como moverte o tocar la pantalla del celular?", bajo: Muy baja, alto: Muy alta }
    - { id: temporal, nombre: Demanda temporal, descripcion: "¿Cuánta presión de tiempo sentiste, entre el tiempo que necesitabas y el que tenías?", bajo: Muy baja, alto: Muy alta }
    - { id: rendimiento, nombre: Rendimiento, descripcion: "¿Qué tan satisfactorio te resultó tu rendimiento en la sesión?", bajo: Muy satisfactorio, alto: Nada satisfactorio }
    - { id: esfuerzo, nombre: Esfuerzo, descripcion: "¿Cuánto esfuerzo mental y físico tuviste que hacer para lograr tu rendimiento?", bajo: Muy bajo, alto: Muy alto }
    - { id: frustracion, nombre: Nivel de frustración, descripcion: "¿Cuánta inseguridad, estrés, irritación o descontento sentiste durante la sesión?", bajo: Muy bajo, alto: Muy alto }
  abierta: ¿Qué sobró y qué faltó?

entrevista:
  - ¿En qué parte del ciclo supieron qué hacer y en cuál se perdieron?
  - ¿Las rondas de sondeo les mostraron algo que no habrían visto conversando?
